name: Build Android APK and Windows ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android project
        run: flutter create --platforms=android --project-name easy_authenticator .
      - name: Add Android camera permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          if 'android.permission.CAMERA' not in s:
              s=s.replace('<application', '<uses-permission android:name="android.permission.CAMERA"/>\n    <application',1)
          p.write_text(s)
          PY
      - name: Dependencies
        run: flutter pub get
      - name: Tests
        run: flutter test test/totp_test.dart
      - name: Build release APK
        run: flutter build apk --release
      - name: Publish Android APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Easy-Authenticator-Android.apk
          gh release create "android-build-${{ github.run_number }}" Easy-Authenticator-Android.apk --target "${{ github.sha }}" --title "Easy Authenticator Android #${{ github.run_number }}" --notes "Automated Android test build. Keep your existing 2FA backup." --prerelease


  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Windows Flutter
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name easy_authenticator .
      - name: Dependencies
        run: flutter pub get
      - name: Tests
        run: flutter test test/totp_test.dart
      - name: Build Windows release
        run: flutter build windows --release
      - name: Package and publish Windows ZIP to GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "Easy-Authenticator-Windows.zip" -Force
          gh release create "windows-build-${{ github.run_number }}" "Easy-Authenticator-Windows.zip" --target "${{ github.sha }}" --title "Easy Authenticator Windows #${{ github.run_number }}" --notes "Portable Windows test build. Extract the full ZIP before running the EXE." --prerelease

