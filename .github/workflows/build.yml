name: Build Android APK and Windows ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android project
        run: flutter create --platforms=android --project-name easy_authenticator .
      - name: Configure Android 8+ and biometric activity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/kotlin/com/example/easy_authenticator/MainActivity.kt')
          if p.exists():
              s=p.read_text().replace('FlutterActivity', 'FlutterFragmentActivity')
              p.write_text(s)
          for p in (Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')):
              if p.exists():
                  s=p.read_text().replace('minSdk = flutter.minSdkVersion','minSdk = 26').replace('minSdk flutter.minSdkVersion','minSdk 26')
                  p.write_text(s)
          PY
      - name: Add Android camera permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          if 'android.permission.USE_BIOMETRIC' not in s:
              s=s.replace('<application', '<uses-permission android:name="android.permission.USE_BIOMETRIC"/>\n    <uses-permission android:name="android.permission.USE_FINGERPRINT"/>\n    <application',1)
          if 'android.permission.CAMERA' not in s:
              s=s.replace('<application', '<uses-permission android:name="android.permission.CAMERA"/>\n    <application',1)
          p.write_text(s)
          PY
      - name: Dependencies
        run: flutter pub get
      - name: Tests
        run: flutter test test/totp_test.dart
      - name: Set Android compile SDK 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in (Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')):
              if p.exists():
                  s = p.read_text()
                  s = s.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
                  s = s.replace('compileSdk flutter.compileSdkVersion', 'compileSdk 36')
                  p.write_text(s)
          PY
      - name: Set plugin compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ['HOME']) / '.pub-cache' / 'hosted' / 'pub.dev'
          for folder in root.glob('file_picker-*'):
              for name in ('android/build.gradle', 'android/build.gradle.kts'):
                  p = folder / name
                  if not p.exists(): continue
                  s = p.read_text()
                  import re
                  s = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', s)
                  s = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', s)
                  s = re.sub(r'compileSdk\s+\d+', 'compileSdk 36', s)
                  p.write_text(s)
                  print('Updated', p, 'compileSdk36=', '36' in s)
          PY
      - name: Build release APK
        run: flutter build apk --release
      - name: Verify APK signature and package integrity
        run: |
          set -e
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$APK_SIGNER"
          "$APK_SIGNER" verify --verbose --print-certs "$APK"
          unzip -t "$APK" | tail -1
          echo "APK verified for release publishing"
      - name: Free runner disk space for Android emulator
        run: |
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/cmake
          sudo docker system prune -af || true
          echo "Disk after cleanup:"
          df -h /
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch APK on Android 13 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: |
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            adb shell monkey -p com.example.easy_authenticator 1
      - name: Publish Android APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Easy-Authenticator-Android.apk
          gh release create "android-build-${{ github.run_number }}" Easy-Authenticator-Android.apk --target "${{ github.sha }}" --title "Easy Authenticator Android #${{ github.run_number }}" --notes "Automated Android test build. Keep your existing 2FA backup." --prerelease


  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Windows Flutter
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name easy_authenticator .
      - name: Dependencies
        run: flutter pub get
      - name: Tests
        run: flutter test test/totp_test.dart
      - name: Build Windows release
        run: flutter build windows --release
      - name: Package and publish Windows ZIP to GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "Easy-Authenticator-Windows.zip" -Force
          gh release create "windows-build-${{ github.run_number }}" "Easy-Authenticator-Windows.zip" --target "${{ github.sha }}" --title "Easy Authenticator Windows #${{ github.run_number }}" --notes "Portable Windows test build. Extract the full ZIP before running the EXE." --prerelease

