name: Play Store Signed AAB

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  play-store-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Validate signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required signing secret: $name"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > /tmp/easy-auth-upload.jks
          test -s /tmp/easy-auth-upload.jks
          keytool -list -keystore /tmp/easy-auth-upload.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
      - name: Generate Android project
        run: flutter create --platforms=android --project-name easy_authenticator .
      - name: Configure Play Store application
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          app = Path('android/app/build.gradle.kts')
          if not app.exists():
              raise SystemExit('Expected Kotlin Gradle file missing')
          s = app.read_text()
          s = s.replace('applicationId = "com.example.easy_authenticator"', 'applicationId = "com.masoodev.easyauthenticator"')
          s = s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 26')
          s = s.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
          s = s.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 35')
          if 'applicationId = "com.masoodev.easyauthenticator"' not in s:
              raise SystemExit('Package identifier replacement failed')
          s = s.replace('android {', '''android {
              signingConfigs {
                  create("releaseUpload") {
                      storeFile = file("/tmp/easy-auth-upload.jks")
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("KEY_ALIAS")
                      keyPassword = System.getenv("KEY_PASSWORD")
                  }
              }
          ''', 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("releaseUpload")')
          if 'signingConfig = signingConfigs.getByName("releaseUpload")' not in s:
              raise SystemExit('Release signing replacement failed')
          app.write_text(s)
          activity = Path('android/app/src/main/kotlin/com/example/easy_authenticator/MainActivity.kt')
          if activity.exists():
              activity.write_text(activity.read_text().replace('FlutterActivity', 'FlutterFragmentActivity'))
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          for perm in ('INTERNET', 'CAMERA', 'USE_BIOMETRIC'):
              if f'android.permission.{perm}' not in m:
                  m = m.replace('<application', f'<uses-permission android:name="android.permission.{perm}"/>' + chr(10) + '    <application', 1)
          m = m.replace('android:label="easy_authenticator"', 'android:label="Easy Authenticator"')
          manifest.write_text(m)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Fix file_picker plugin Android compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          root = Path(os.environ['HOME']) / '.pub-cache' / 'hosted' / 'pub.dev'
          for folder in root.glob('file_picker-*'):
              for name in ('android/build.gradle', 'android/build.gradle.kts'):
                  p = folder / name
                  if not p.exists():
                      continue
                  s = p.read_text()
                  s = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', s)
                  s = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', s)
                  s = re.sub(r'compileSdk\s+\d+', 'compileSdk 36', s)
                  p.write_text(s)
                  print('Updated', p)
          PY
      - name: Run tests
        run: flutter test test/totp_test.dart
      - name: Build signed Play Store AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release --build-name="1.0.${{ github.run_number }}" --build-number="${{ github.run_number }}" --dart-define=SUPABASE_URL=https://uuvqawlqcnrcdribwava.supabase.co --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_cXKjv4juWoZbJhV0ZUrIrQ_DwzhuENS
      - name: Build signed Android APK with same version
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --build-name="1.0.${{ github.run_number }}" --build-number="${{ github.run_number }}" --dart-define=SUPABASE_URL=https://uuvqawlqcnrcdribwava.supabase.co --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_cXKjv4juWoZbJhV0ZUrIrQ_DwzhuENS
      - name: Verify signed APK
        run: |
          set -eu
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APK_SIGNER" verify --verbose --print-certs "$APK"
          unzip -t "$APK" | tail -1
      - name: Verify release bundle
        run: |
          set -eu
          AAB=build/app/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          unzip -t "$AAB" | tail -1
          jarsigner -verify "$AAB"
      - name: Verify package identity and version
        run: |
          set -eu
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | head -1 | tee /tmp/easy-auth-package.txt
          grep -F "name='com.masoodev.easyauthenticator'" /tmp/easy-auth-package.txt
          grep -F "versionCode='${{ github.run_number }}'" /tmp/easy-auth-package.txt
      - name: Publish signed APK and AAB to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="playstore-build-${{ github.run_number }}"
          gh release create "$TAG" \
            build/app/outputs/flutter-apk/app-release.apk#Easy-Authenticator-${{ github.run_number }}.apk \
            build/app/outputs/bundle/release/app-release.aab#Easy-Authenticator-${{ github.run_number }}.aab \
            --title "Easy Authenticator signed Android build ${{ github.run_number }}" \
            --notes "Signed APK and Play Store AAB; package com.masoodev.easyauthenticator; versionCode ${{ github.run_number }}." \
            --prerelease
      - name: Remove upload key from runner
        if: always()
        run: rm -f /tmp/easy-auth-upload.jks
